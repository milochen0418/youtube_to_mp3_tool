[tool.poetry]
name = "youtube-to-mp3-tool"
version = "0.1.0"
description = "Find music on YouTube, preview it and convert it to MP3 into the shared audio collection"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "youtube_to_mp3_tool"}]

[tool.poetry.dependencies]
# 3.11 floor: Reflex 0.10 and the re_ddns smart-launcher image (python:3.11).
# <3.16 cap: verified up to 3.15.
python = ">=3.11,<3.16"
reflex = "0.10.0"
# "default" brings yt-dlp-ejs, which solves YouTube's JavaScript challenges with
# whichever runtime the machine has (deno, node or bun). Not capped: YouTube
# changes often and only a current yt-dlp keeps up.
yt-dlp = {version = ">=2025.10.22", extras = ["default"]}
# Shared storage (the "audio" collection) and DDNS Intent (the audio.find dialog).
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 150
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
    "*.egg",
    ".reflex",
    "web",
    ".web"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]